name: Publicar Auto-Pobre Racing

# Publishing is manual: pushes to main no longer replace the live game.
# Actions -> Publicar Auto-Pobre Racing -> Run workflow, choosing what to publish.
# The main link shows `versao` (the announced version; its `default` below is the only place that
# names it). /dev/ is the museum (user, 2026-10-25): the old test version, kept at `versao_dev`
# (apr-3.3-rc6, as it was when dev.autopobre.com.br took over). The test version now lives at
# dev.autopobre.com.br, published by autopobre/dev through montar-dev.yml. Each address here is built
# from its own checkout, tested and packed into one Pages site; the same commit on both is tested once.
# An empty versao_dev leaves /dev/ out. The legacy versions (apr-1.0, apr-2.1) are no longer published:
# they stay as tags. The multiplayer test room goes only to the test versions (/dev/ here); the run fails
# if the main link would carry it.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Link principal (autopobre.com.br): qual versão do jogo vai ali. Tag (apr-X.Y), branch (main) ou commit.'
        required: true
        default: apr-3.3-rc6
      versao_dev:
        description: 'Endereço autopobre.com.br/dev/ (o museu: a versão de testes antiga, parada na apr-3.3-rc6; a versão de testes agora é dev.autopobre.com.br). Se apagar este campo, o /dev/ sai do ar.'
        required: false
        default: apr-3.3-rc6

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Baixar a versao do link principal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.versao }}
          path: principal
          persist-credentials: false
      - name: Baixar a versao de /dev/
        if: ${{ inputs.versao_dev != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.versao_dev }}
          path: dev
          persist-credentials: false
      # migrar.html brings the saves from the old address (pista_interlagos/migracao). It is the same
      # for both versions: it comes from the commit this run started from and lands at the site's root.
      # The list of checks (scripts/testes_publicacao.txt) comes from the same commit, and so does the records'
      # bridge to dev.autopobre.com.br (pista_interlagos/ponte: this address's records, sent back in the link).
      - name: Baixar a pagina que traz os dados do endereco antigo, a ponte dos recordes e a lista de testes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: atual
          persist-credentials: false
          sparse-checkout: |
            pista_interlagos/migracao
            pista_interlagos/ponte
            pista_interlagos/scripts
      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '*/pista_interlagos/teste/package-lock.json'
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Instalar a dependencia fixada no lock
        run: |
          for pasta in principal dev; do
            [ -d "$pasta" ] || continue
            npm ci --prefix "$pasta/pista_interlagos/teste" --ignore-scripts --no-audit --no-fund
          done
      - name: Verificar cada versao (preferencias, audio, contatos, corrida, boxes)
        run: |
          lista=atual/pista_interlagos/scripts/testes_publicacao.txt
          [ -s "$lista" ] || { echo "::error::Falta a lista de testes $lista."; exit 1; }
          pastas="principal dev"
          # Both addresses on one commit (the usual case right after a release): test it once, as /dev/.
          if [ -d dev ] && [ "$(git -C principal rev-parse HEAD)" = "$(git -C dev rev-parse HEAD)" ]; then
            echo "::notice::principal e dev sao o mesmo commit: os testes rodam uma vez, em dev."
            pastas=dev
          fi
          for pasta in $pastas; do
            [ -d "$pasta" ] || continue
            echo "::group::Testes de $pasta"
            for teste in $(grep -v '^#' "$lista"); do
              # The list is the running commit's: a version pinned older (a tag published again to roll back,
              # or /dev/ kept where it was while only the root's pages change) can predate a test and skips it.
              if [ ! -f "$pasta/pista_interlagos/scripts/$teste.mjs" ]; then
                echo "::notice::$pasta nao tem $teste (versao anterior ao teste): pulado."
                continue
              fi
              (cd "$pasta" && node "pista_interlagos/scripts/$teste.mjs")
            done
            echo "::endgroup::"
          done
      # The multiplayer test room goes only to /dev/: the main link is built without it.
      - name: Gerar somente os arquivos publicos (/dev/ numa subpasta)
        run: |
          (cd principal && python pista_interlagos/scripts/preparar_publicacao.py)
          [ ! -d dev ] || (cd dev && python pista_interlagos/scripts/preparar_publicacao.py --multiplayer)
          mkdir site
          cp -a principal/dist/. site/
          if [ -d dev ]; then
            mkdir site/dev
            cp -a dev/dist/. site/dev/
          fi
          for arquivo in migrar.html migrar.js migrar.css save-migration.js migration-check.js; do
            [ ! -e "site/$arquivo" ] || { echo "::error::A versao principal ja tem $arquivo; a pagina de migracao nao pode substitui-lo."; exit 1; }
            cp "atual/pista_interlagos/migracao/$arquivo" site/
          done
          # The bridge exists only from the commit that brought it (an older running commit publishes none).
          for arquivo in levar-recordes.html levar-recordes.js; do
            [ -e "atual/pista_interlagos/ponte/$arquivo" ] || continue
            [ ! -e "site/$arquivo" ] || { echo "::error::A versao principal ja tem $arquivo; a ponte dos recordes nao pode substitui-lo."; exit 1; }
            cp "atual/pista_interlagos/ponte/$arquivo" site/
          done
          # Both versions check, before the game starts, whether this browser still has saves at the
          # old address (migration-check.js). The tags stay as they are: the line goes in at publishing.
          for pagina in site/index.html site/dev/index.html; do
            [ -f "$pagina" ] || continue
            grep -q '<script type="importmap">' "$pagina" || { echo "::error::$pagina nao tem import map: a checagem dos dados antigos nao tem onde entrar."; exit 1; }
            sed -i '0,/<script type="importmap">/s//<script src="\/migration-check.js"><\/script><script type="importmap">/' "$pagina"
          done
      # A commit from before the build knew --multiplayer always packs it: that one cannot go to the main link.
      - name: Conferir que o multiplayer e a bancada de som ficaram so em /dev/ e as contas fora deste site
        run: |
          for pasta in principal; do
            for arquivo in multiplayer.js multiplayer.css net-room.js net-cars.js net-link.js net-verify.js; do
              if [ -e "$pasta/dist/$arquivo" ]; then
                echo "::error::A versao de $pasta tem o multiplayer ($arquivo); ele so pode ir para /dev/."
                exit 1
              fi
            done
            for arquivo in bancada-som.html bancada-som.js; do
              if [ -e "$pasta/dist/$arquivo" ]; then
                echo "::error::A versao de $pasta tem a bancada de som ($arquivo); ela so pode ir para /dev/."
                exit 1
              fi
            done
            if grep -rqE 'sala[.](autopobre|inteligenciamilgrau)[.]com[.]br' --include='*.js' --include='*.html' "$pasta/dist"; then
              echo "::error::A versao de $pasta conecta ao servidor das salas; o multiplayer so pode ir para /dev/."
              exit 1
            fi
          done
          # The accounts go only to dev.autopobre.com.br (autopobre/dev): neither address here has their server.
          for pasta in principal dev; do
            [ -d "$pasta/dist" ] || continue
            for arquivo in conta.js conta.css recordes-online.js comandos-volta.js admin.html admin.js admin.css; do
              if [ -e "$pasta/dist/$arquivo" ]; then
                echo "::error::A versao de $pasta tem as contas ($arquivo); elas so podem ir para dev.autopobre.com.br."
                exit 1
              fi
            done
            # By content too, should a later module call the accounts' server or turn them on.
            if grep -rqE '/api/(conta|recordes|admin)|const CONTA=true;' --include='*.js' --include='*.html' "$pasta/dist"; then
              echo "::error::A versao de $pasta chama o servidor das contas ou liga as contas; elas so podem ir para dev.autopobre.com.br."
              exit 1
            fi
          done
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Enviar o jogo para publicacao
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
